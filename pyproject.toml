[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-flow-sdk-py"
version = "0.1.3"
description = "Python SDK for the Workflow Engine (SeaFlow) project-facing API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "SeaArt" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SeaArt-Infra/sea-flow-sdk-py"
Repository = "https://github.com/SeaArt-Infra/sea-flow-sdk-py"

[tool.setuptools.packages.find]
include = ["sea_flow_sdk*"]
